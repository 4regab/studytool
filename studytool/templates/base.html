<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Flashcards{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2337352f'/><rect x='4' y='5' width='8' height='6' rx='1' fill='white'/></svg>">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 btn bg-white">Skip to content</a>
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur">
    <nav class="flex h-11 items-center gap-1 overflow-hidden px-3 text-sm text-muted" aria-label="Breadcrumb">
      <a href="/" class="btn btn-sm shrink-0 font-medium text-ink">Flashcards</a>
      {% block crumbs %}{% endblock %}
      {% if not worker_status() %}
        <span class="ml-auto flex shrink-0 items-center gap-1.5 text-[13px] text-[#c4554d]" title="Start the app with: uv run python run.py">
          <span class="size-1.5 rounded-full bg-[#c4554d]" aria-hidden="true"></span>Worker stopped
        </span>
      {% endif %}
    </nav>
  </header>
  <main id="main" class="mx-auto w-full {% block width %}max-w-3xl{% endblock %} px-5 pt-8 pb-24 sm:px-8 sm:pt-14">
    {% block content %}{% endblock %}
  </main>
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-5 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>
</body>
</html>
