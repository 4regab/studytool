[project]
name = "studytool"
version = "0.1.0"
description = "Local app that turns study PDFs into source-backed Anki flashcards (front,back CSV)."
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.31.0",
    "pydantic==2.14.1",
    "pymupdf==1.28.2",
    "streamlit==1.66.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
