[project]
name = "studytool"
version = "0.1.0"
description = "Local app that turns study PDFs into source-backed Anki flashcards (front,back CSV)."
requires-python = ">=3.12"
dependencies = [
    "genanki==0.13.1",
    "jinja2==3.1.6",
    "pydantic==2.14.1",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "starlette==1.8.0",
    "streamlit==1.66.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
